<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Geofence Ring 3 -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />
  
  <!-- Geofence Ring 2 -->
  <circle cx="256" cy="256" r="145" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.45" />

  <!-- Geofence Ring 1 (Pulse) -->
  <circle cx="256" cy="256" r="95" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="5" stroke-opacity="0.75" />

  <!-- Crosshair Radar Lines -->
  <line x1="256" y1="60" x2="256" y2="452" stroke="#64748b" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 6" />
  <line x1="60" y1="256" x2="452" y2="256" stroke="#64748b" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 6" />

  <!-- Central Map Pin / Geofence Target -->
  <g filter="url(#glow)">
    <path d="M256 120 C 205 120 164 161 164 212 C 164 275 240 368 251 381 C 253 384 259 384 261 381 C 272 368 348 275 348 212 C 348 161 307 120 256 120 Z" fill="url(#pinGrad)" />
    <!-- Pin Center Eye / Radar Dot -->
    <circle cx="256" cy="208" r="30" fill="#ffffff" />
    <circle cx="256" cy="208" r="16" fill="#0f172a" />
    <circle cx="256" cy="208" r="8" fill="#22c55e" />
  </g>

  <!-- Live Pulse Beacon Waves around tip -->
  <circle cx="256" cy="382" r="14" fill="#ef4444" fill-opacity="0.4" />
  <circle cx="256" cy="382" r="6" fill="#ffffff" />
</svg>
